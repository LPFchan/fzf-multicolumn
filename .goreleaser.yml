---
version: 2
project_name: fzf-multicolumn

before:
  hooks:
    - go mod download

builds:
  - id: fzf
    binary: fzf-multicolumn
    goos:
      - darwin
      - linux
      - windows
      - freebsd
      - openbsd
      - android
    goarch:
      - amd64
      - arm
      - arm64
      - loong64
      - ppc64le
      - s390x
      - riscv64
    goarm:
      - "5"
      - "6"
      - "7"
    flags:
      - -trimpath
    ldflags:
      - "-s -w -X main.version={{ .Version }} -X main.revision={{ .ShortCommit }}"
    ignore:
      - goos: freebsd
        goarch: arm
      - goos: openbsd
        goarch: arm
      - goos: freebsd
        goarch: arm64
      - goos: openbsd
        goarch: arm64
      - goos: openbsd
        goarch: riscv64
      - goos: android
        goarch: amd64
      - goos: android
        goarch: arm

# .goreleaser.yaml
notarize:
  macos:
    - # Whether this configuration is enabled or not.
      #
      # Default: false.
      # Templates: allowed.
      enabled: "{{ not .IsSnapshot }}"

      # Before notarizing, we need to sign the binary.
      # This blocks defines the configuration for doing so.
      sign:
        # The .p12 certificate file path or its base64'd contents.
        certificate: "{{.Env.MACOS_SIGN_P12}}"

        # The password to be used to open the certificate.
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"

      # Then, we notarize the binaries.
      notarize:
        # The issuer ID.
        # Its the UUID you see when creating the App Store Connect key.
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"

        # Key ID.
        # You can see it in the list of App Store Connect Keys.
        # It will also be in the ApiKey filename.
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"

        # The .p8 key file path or its base64'd contents.
        key: "{{.Env.MACOS_NOTARY_KEY}}"

        # Whether to wait for the notarization to finish.
        # Not recommended, as it could take a really long time.
        wait: true

archives:
  - name_template: "{{ .ProjectName }}-{{ .Version }}-{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    ids:
      - fzf
    formats:
      - tgz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - non-existent*

nfpms:
  - package_name: fzf-multicolumn
    file_name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    vendor: LPFchan
    homepage: https://github.com/LPFchan/fzf-multicolumn
    maintainer: yeowool <me@lost.plus>
    description: Command-line fuzzy finder with multicolumn grid layout
    license: MIT
    section: utils
    formats:
      - deb
    ids:
      - fzf
    contents:
      - src: man/man1/fzf.1
        dst: /usr/share/man/man1/fzf-multicolumn.1
      - src: LICENSE
        dst: /usr/share/doc/fzf-multicolumn/copyright

checksum:
  name_template: "{{ .ProjectName }}-{{ .Version }}-checksums.txt"

release:
  github:
    owner: LPFchan
    name: fzf-multicolumn
  prerelease: auto
  name_template: '{{ .Version }}'

snapshot:
  version_template: "{{ .Version }}-devel"

changelog:
  sort: asc
  filters:
    exclude:
      - README
      - test
