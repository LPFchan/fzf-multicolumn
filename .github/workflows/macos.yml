---
name: Test fzf on macOS

on:
  push:
    branches: [ master, devel, multicolumn ]
  pull_request:
    branches: [ master, multicolumn ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: "1.23"

    - name: Setup Ruby
      uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
      with:
        ruby-version: 3.4.6

    - name: Install packages
      run: HOMEBREW_NO_INSTALL_CLEANUP=1 brew install fish zsh tmux shfmt

    - name: Install Nushell
      run: |
        arch="$(uname -m)"
        if [ "$arch" = arm64 ]; then arch=aarch64; fi
        archive="nu-0.114.1-${arch}-apple-darwin"
        curl -fsSL "https://github.com/nushell/nushell/releases/download/0.114.1/${archive}.tar.gz" -o "$RUNNER_TEMP/nu.tar.gz"
        tar -xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP"
        sudo install "$RUNNER_TEMP/${archive}/nu" /usr/local/bin/nu

    - name: Install Ruby gems
      run: bundle install

    - name: Rubocop
      run: make lint

    - name: Unit test
      run: make test

    - name: Integration test
      run: make install && ./install --all && LC_ALL=C tmux new-session -d && ruby test/runner.rb --verbose
